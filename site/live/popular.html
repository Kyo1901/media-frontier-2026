<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
  <title>인기 기사 — 뉴스</title>
</head>
<body>

<div class="page">

<header class="site-header">뉴스</header>

<nav class="site-nav">
  <ul>
    <li><a href="../section/politics.html">정치</a></li>
    <li><a href="../section/economy.html">경제</a></li>
    <li><a href="../section/society.html">사회</a></li>
    <li><a href="../section/culture.html">문화</a></li>
    <li><a href="../section/sports.html">스포츠</a></li>
    <li><a href="../section/it.html">IT</a></li>
  </ul>
</nav>

<main class="content">
  <h1>인기 기사</h1>

  <p id="msg">불러오는 중…</p>
  <ul id="popular" class="article-list"></ul>

  <script>
  fetch("popular.json")
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      document.getElementById("msg").remove();
      document.getElementById("popular").innerHTML = rows.map(function (a) {
        return '<li class="card"><span class="badge">' + a.section + '</span>' +
               '<a href="../article/' + a.id + '.html">' + a.title + '</a>' +
               '<dl><dt>기자</dt><dd class="reporter">' + a.reporter + '</dd>' +
               '<dt>조회</dt><dd class="views">' + a.views.toLocaleString() + '</dd></dl></li>';
      }).join("");
    });
  </script>
</main>

<aside class="side">
  <h2>안내</h2>
  <ul>
    <li><a href="../index.html">처음으로</a></li>

</aside>

<footer>© 2026 뉴스 — 크롤링 연습용</footer>

</div>

</body>
</html>
