<main class="content">
  <h1>최신 기사</h1>

  <p>아래로 내리면 더 나옵니다.</p>
  <ul id="feed" class="article-list"></ul>
  <p id="more">불러오는 중…</p>

  <script>
  var next = "feed-1.json", loading = false;
  function card(a) {
    return '<li class="card"><span class="badge">' + a.section + '</span>' +
           '<a href="../article/' + a.id + '.html">' + a.title + '</a>' +
           '<dl><dt>기자</dt><dd class="reporter">' + a.reporter + '</dd>' +
           '<dt>발행</dt><dd><time datetime="' + a.published_at + '">' + a.published_at.slice(0, 16) + '</time></dd>' +
           '<dt>조회</dt><dd class="views">' + (a.views === null ? "-" : a.views.toLocaleString()) + '</dd></dl></li>';
  }
  function loadMore() {
    if (loading || !next) return;
    loading = true;
    fetch(next)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.getElementById("feed").insertAdjacentHTML("beforeend", d.items.map(card).join(""));
        next = d.next;
        loading = false;
        document.getElementById("more").textContent = next ? "아래로 내리면 더 나옵니다" : "마지막입니다";
      });
  }
  window.addEventListener("scroll", function () {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) loadMore();
  });
  loadMore();
  </script>
</main>
