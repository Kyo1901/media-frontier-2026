<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File02_박스모델.html</title>
    <style>

        /* CSS 박스 모델 */
        /*  - 요소의 영역 종류 */
        /*     1. 컨텐츠 영역  : 하위 요소 또는 내부 문자가 배치되는 영역 */
        /*     2. 내부 여백    : 요소의 외각과 컨텐츠 사이의 여백 */
        /*     3. 테두리       : 요소의 외각 선 */
        /*     4. 외부 여백    : 다른 요소와의 여백 */
        
        .card { background-color: lightcyan; }
        
        /* 컨텐츠 영역의 크기 */
        /*  - width  : 요소의 너비 = 가로 크기 */
        /*  - height : 요소의 높이 = 세로 크기 */
        /*  → 속성 값 단위: px, % */
        /* 내부 여백의 크기 */
        /*  - padding       : 요소의 내부 여백 = 상하좌우 설정 */
        /*  - padding-방향  : 지정된 방향의 내부 여백 */
        /* 테두리 영역의 크기 */
        /*  - 테두리의 종류, 두께, 색상을 설정 */
        /*  - border        : 종류, 두께, 색상을 한 번에 설정 */
        /*  - border-style  : 테두리 종류 */
        /*  - border-width  : 테두리 두께 */
        /*  - border-color  : 테두리 색상 */
        /* 외부 여백의 크기 */
        /*  - margin        : 요소의 외부 여백 = 상하좌우 설정 */
        /*  - margin-방향   : 지정된 방향의 외부 여백 */
        .card {
            /* 너비 400px */
            width:400px;
            /* 높이 180px */
            height: 180px;

            /* 내부 여백을 16px 로 설정 */
            /* padding: 16px; */
            padding-left: 16px;

            /* 3px 두께의 검은색 실선을 표시 */
            border: 3px solid black;
            /* 3px 두께의 검은색 점선을 표시 */
            border: 3px dotted black;
            /* 3px 두께의 검은색 짧은 선을 표시 */
            border: 3px dashed black;
            /* 5px 두께의 navy 색 실선을 표시 */
            border: 5px solid navy;

            /* 외부 여백: 16px */
            margin: 16px;

            /* margin 과 padding 속성은 하나의 속성으로 */
            /* 네 방향의 여백 값을 각각 다르게 설정할 수 있다. */
            /*  → 값이 하나인 경우: 네 방향 모두 동일 */
            /*  → 값이 두개인 경우: 상하, 좌우 */
            /*  → 값이 세개인 경우: 상, 좌우, 하 */
            /*  → 값이 네개인 경우: 위에서부터 시계 방향 순 */
            margin: 16px 0;
            
            /* 외부 여백 중 좌우에 auto 값을 설정할 경우 */
            /* 좌우에 동일한 외부 여백이 자동으로 설정된다. */
            margin: 16px auto;
        }


        /* 박스 모델 관련 속성 */
        /*  - border-radius : 모서리를 둥글게 만들기 위한 속성 */
        /*  - box-sizing    : 박스의 크기를 설정하는 기준을 정하는 속성 */
        .card {
            border-radius: 8px;
            border-radius: 40px;
            border-radius: 20px;
            border-radius:  0 16px 16px 0;

            /* 요소의 크기 계산 기준 */
            box-sizing: content-box;
            /* → 크기 속성이 컨텐츠 영역의 크기로만 설정 */
            box-sizing: border-box;
            /* → 크기 속성이 테두리까지의 크기로 설정 */
            /* → 내부 여백과 테두리는 각 속성에 설정된 값으로 설정 */
            /*   컨텐츠 영역의 크기만 브라우저에서 계산되어 설정 */

            /* border: 12px solid navy; */
        }

        /* 
        .card { margin: 0; border-radius: 0; }
        .card:first-of-type { border-radius: 16px 16px 0 0; }
        .card:last-of-type { border-radius:  0 0 16px 16px; }
         */

        .circle {
            width: 200px;
            height: 200px;
            border: 50px solid navy;
            margin: 20px auto;
            background-color: paleturquoise;
            border-radius: 100px;

            /* 요소의 크기 반절만큼으로 설정 = 원 */
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>주제</h3>
        <p>
            웹툰의 평점은 장르, 완결 여부, 무료 여부에 따라 달라지는가?
        </p>
    </div>
    <div class="card">
        <h3>분석 질문</h3>
        <ol>
            <li>장르마다 평점이 다른가?</li>
            <li>완결작이 연재작보다 평점이 높은가?</li>
            <li>무료와 유료 작품은 무엇이 다른가?</li>
        </ol>
    </div>
    <div class="card">
        <h3>팀원</h3>
        <ul>
            <li>팀원 A : 팀장, 질문 정리, 발표</li>
            <li>팀원 B : 전처리, 차트 1 ~ 3</li>
            <li>팀원 C : 차트 4 ~ 6, 표</li>
            <li>팀원 D : 웹 페이지, CSS</li>
        </ul>
    </div>

    <div class="circle"></div>
</body>
</html>
