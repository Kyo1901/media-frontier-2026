
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 작성하기</title>
</head>
<body>
    <!-- 태그(Tag) -->
    <!--  - 브라우저에서 사용자에게 컨텐츠를 제공하기 위한 수단 -->
    <!--     = 제목, 문단, 이미지, 영상, 링크, ... -->
    <!--  - 여러 컨텐츠들을 묶어 하나의 영역으로 만들기 위한 수단 -->
    <!--     = 시멘틱, 목록, 테이블, 입력 양식, ...  -->
    <!--  - 컨텐츠 또는 영역을 만들기 위해 태그를 사용하며 -->
    <!--    해당 영역의 시작과 끝을 만들기 위해  -->
    <!--    시작 태그와 끝 태그를 작성한다. -->
    
    <!-- 태그 없이 컨텐츠만 작성할 경우 -->
    <!-- 해당 컨텐츠를 별도로 선택할 수단이 없다. -->
    <!--  → 스타일도 기능도 아무것도 부여할 수 없다. -->

    <h1>안녕하세요.</h1>
    
    <p style="font-style: italic;">저는 김기호이고, 32살입니다.</p>

    <!-- 속성(Attribute) -->
    <!--  - HTML 태그(= 요소, Element)에 추가적으로 부여하는 설정 값 -->
    <!--  - 속성은 시작 태그 안에 작성되어야 하며, -->
    <!--    속성명="값" -->


</body>
</html>
