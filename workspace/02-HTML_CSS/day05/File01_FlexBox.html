<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File01_FlexBox.html</title>
    <style>
        /* 대부분의 요소들은 block 형식 */
        /*  → 한 행(줄)을 자신의 영역으로 차지한다. */
        /*  → 크기, 여백, 위치를 가질 수 있다. */

        .section-list > li {
            display: block;
            /* → 한 행을 자신의 영역으로 차지 */
            /* → 크기, 여백, 위치를 가질 수 있다. */
            /* → div 태그, h 태그, p 태그, ol, ul 태그, ...*/

            display: inline;
            /* → 내부 문자만큼 자신의 영역으로 차지 */
            /* → 크기, 일부 여백, 위치를 가질 수 없다. */
            /* → strong, em, a, span, ... */

            display: inline-block;
            /* → 내부 문자만큼을 자신의 영역으로 차지 */
            /* → 크기와 여백을 가질 수 있다. */
            /* → 위치는 가질 수 없다. */
            /* → input, button, img, ... */

            /* li 요소의 기본 속성 값 */
            display: list-item;
        }

        /* .section-list 요소의 하위 항목들을 나란히 나열 */
        /*  → .sectoin-list : Flex Container */
        /*  → 하위 항목(li) : Flex Item  */
        .section-list {
            display: flex;
            /* 기본   : 가로로 나열 */
            /* 주축   : item 이 나열되는 방향 = 가로 */
            /* 교차축 : 주축과 교차죄는 방향  = 세로 */

            /* 주축 정렬 */
            justify-content: flex-start;
            justify-content: center;
            justify-content: flex-end;
            justify-content: space-between;
            /* item 사이 간격을 동일하게 두고 나열 */


            /* 교차축 정렬 */
            align-items: stretch;
            /* → 교차축 방향으로 꽉 채운다. */
            align-items: center;
            align-items: flex-start;
            align-items: flex-end;

            /* 목록 태그의 마커 제거 */
            list-style: none;

            justify-content: flex-start;
            gap: 8px;
            /* item 사이 간격 */


            width: 80%;
            height: 40px;
            padding: 16px;
            margin: 16px auto;
            border: 1px solid gray;
        }

        .section-list > li {
            padding: 4px 4px;
            border: 1px solid blue;
        }


        .introduction {
            border: 2px solid navy;

            /* .card 를 나열하기 위해 flex container로 지정 */
            display: flex;
            justify-content: center;
            gap: 16px;

            flex-wrap: wrap;
            
        }
        .introduction .card {
            width: 300px;
            border: 1px solid blue;
            border-radius: 6px;
            padding: 8px;
            box-sizing: border-box;
            /* → 크기 속성의 설정 범위: 테두리까지의 크기 */
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <ul class="section-list">
            <li>정치</li>
            <li>경제</li>
            <li>사회</li>
            <li>문화</li>
            <li>스포츠</li>
            <li>IT</li>
        </ul>
    </nav>

    <!-- 4일차 폴더 File02 파일의 코드를 복붙 -->
    <div class="introduction">
        <div class="card">
            <h3>주제</h3>
            <p>
                웹툰의 평점은 장르, 완결 여부, 무료 여부에 따라 달라지는가?
            </p>
        </div>
        <div class="card">
            <h3>분석 질문</h3>
            <ol>
                <li>장르마다 평점이 다른가?</li>
                <li>완결작이 연재작보다 평점이 높은가?</li>
                <li>무료와 유료 작품은 무엇이 다른가?</li>
            </ol>
        </div>
        <div class="card">
            <h3>팀원</h3>
            <ul>
                <li>팀원 A : 팀장, 질문 정리, 발표</li>
                <li>팀원 B : 전처리, 차트 1 ~ 3</li>
                <li>팀원 C : 차트 4 ~ 6, 표</li>
                <li>팀원 D : 웹 페이지, CSS</li>
            </ul>
        </div>
    </div>
</body>
</html>
