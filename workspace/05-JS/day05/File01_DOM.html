<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File01_DOM.html</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 인기 뉴스의 스타일 */
        .hot {
            border: 3px solid navy;
        }
    </style>
</head>

<body>
    <ul id="title-list">
        <li>
            <a href="">여야 예산안 놓고 공방</a>
        </li>
        <li>
            <a href="">반도체 정책 발표에 업계 촉각</a>
        </li>
    </ul>

    <script>
        // JS 내에서 HTML 요소 탐색
        //  → 브라우저가 HTML 문서를 읽고 DOM 에 요소를 만들어야 탐색 및 조작이 가능  
        //  → 요소 탐색 메서드
        //      document.querySelector(선택자)      → 선택자에 해당하는 첫 번째 요소
        //      document.querySelectorAll(선택자)   → 선택자에 해당하는 요소들
        //      document.getElementById(ID속성)     → id 속성 값이 일치하는 요소

        const ul = document.querySelector("#title-list");

        console.table(ul);
        console.table(ul.children); // ul 요소의 자식 요소들
        console.table(ul.children.length); // ul 요소의 자식 요소의 수
        console.log(ul.firstElementChild.nextElementSibling);
        // = ul 의 첫 번째 자식 요소의 다음 형제 요소
        // = 두 번째 카드

        // 탐색한 요소는 기능(이벤트)를 추가한다거나
        // 스타일을 바꾼다거나, 하위 요소나 구성을 바꾸는 등이 가능하다.

        // 스타일 수정
        //  - 요소 노드의 style 속성을 통해 인라인 스타일을 설정할 수 있다.
        //  - 속성 접근 연산자(.)을 통해 스타일 속성을 지정할 때는
        //    하이픈(-)을 작성할 수 없기 때문에 식별자 형태로 작성
        //  - 인덱스 연산자를 통해 스타일 속성을 지정할 때는
        //    스타일 속성을 문자열로 작성하며
        //    하이픈(-)을 포함한 스타일 속성 명으로 작성이 가능하다.

        ul.style.backgroundColor = "pink";
        ul.style["list-style"] = "none";    // 마커 제거
    </script>
    <script>
        // DOM 에 없는 요소를 탐색을 시도
        //  → 아직 생성이 되지 않은 경우
        //  → 선택자를 잘못 작성한 경우
        const h1 = document.querySelector("h1");
        // = 오류가 발생하지 않는다.
        // → 선택자에 해당하는 요소가 없더라도 정상 처리
        // → h1 에는 아무 요소가 없기 때문에 null 로 저장
        console.log(h1);

        // h1.style.color = "red";
        // Uncaught TypeError: Cannot read properties of null (reading 'style')
        // → h1 은 null 을 저장하고 있과, null 은 아무 값도 없는 상태임을 알리는 값
        // → style 속성이 없기 때문에 접근 자체가 되지 않는다.

        // h1.innerText = "태그에 내부 문자 작성하기";
        // Uncaught TypeError: Cannot set properties of null (setting 'innerText')
        // → null 에는 아무런 속성도 추가할 수 없다.
    </script>
    <hr>

    <div class="page">

        <header class="site-header">뉴스</header>

        <form class="search" action="#">
            <label for="q">검색</label>
            <input type="text" id="q" name="q">
            <button type="submit" class="btn">찾기</button>
        </form>

        <main class="content">

            <h1 id="title">경제</h1>

            <p id="count">카드를 세어 보세요</p>

            <ul id="list">
                <li class="card">
                    <span class="badge">경제</span>
                    <a href="#">환율 정책 발표에 업계 촉각</a>
                    <dl>
                        <dt>기자</dt>
                        <dd>이지민</dd>
                        <dt>조회</dt>
                        <dd class="views">1,039</dd>
                    </dl>
                </li>
                <li class="card hot">
                    <span class="badge">경제</span>
                    <a href="#">고용 수출 22% 증가</a>
                    <dl>
                        <dt>기자</dt>
                        <dd>장지민</dd>
                        <dt>조회</dt>
                        <dd class="views">7,138</dd>
                    </dl>
                </li>
                <li class="card">
                    <span class="badge">경제</span>
                    <a href="#">금리 지수 31% 변동</a>
                    <dl>
                        <dt>기자</dt>
                        <dd>박서준</dd>
                        <dt>조회</dt>
                        <dd class="views">3,748</dd>
                    </dl>
                </li>
            </ul>
        </main>
    </div>
    <script>
        // 뉴스 페이지의 섹션 제목을 "정치"로 수정
        // → 나중에 원하는 섹션 제목으로 수정이 가능해진다.
        const title = document.querySelector("h1#title");

        // title 은 h1 요소를 노드 객체로 저장하고 있다.
        //  → 노드가 가진 속성 중 innerText 를 통해 내부 문자를 조작
        title.innerText = "정치";   // 내부 문자 설정
        title.style.textDecoration = "underline";   // 스타일 설정

        // 조회수가 7000 이상이면 인기 있어보이는 스타일
        //  - 스타일 자체가 상황에 따라 추가 및 삭제
        //  - 스타일 속성 값 자체는 고정
        //  → class 로 스타일을 정의하고
        //    JS 로 class 를 조작하는 방식(권장)

        // 두 번째 카드를 탐색
        const card = document.querySelector(".card:nth-child(2)");

        // 요소 노드의 class 조작 관련 속성
        //  - classList = class 들이 저장된 배열 (권장)
        //  - className = class 속성 값을 문자열로 저장한 속성
        console.log(card.classList);    // = ["card", "hot"]
        console.log(card.className);    // = "card hot"

        card.classList.remove("hot");   // 클래스 hot 을 제거

        card.classList.add("hot");      // 클래스 hot 을 추가

        card.classList.toggle("hot");    // 클래스 hot 을 추가 및 제거
        // → 지정된 클래스가 있으면 제거
        //   지정된 클래스가 없으면 추가
    </script>

    <script>
        const rows = [
            { title: "여야 예산안 놓고 공방", section: "정치", reporter: "조채원", views: 3562 },
            { title: "반도체 정책 발표에 업계 촉각", section: "경제", reporter: "장지민", views: 5159 },
            { title: "미술관 전시 개막", section: "문화", reporter: "강도현", views: 12217 },
            { title: "수도권 조사 결과 공개", section: "사회", reporter: "조도현", views: 7720 },
            { title: "국내 기업 서비스 개편", section: "IT", reporter: "권민준", views: 9739 },
            { title: "국가대표 감독 교체", section: "스포츠", reporter: "오수빈", views: 10873 },
            { title: "K리그 결승 진출", section: "스포츠", reporter: "김예은", views: 847 },
            { title: "의료 관련 신고 급증", section: "사회", reporter: "김예은", views: 1109 },
            { title: "주거 제도 개선 요구", section: "사회", reporter: "조채원", views: 9859 },
            { title: "국가대표 결승 진출", section: "스포츠", reporter: "장태윤", views: null },
        ];

        // 새로운 뉴스 카드를 추가

        // 1. ul#list 요소에 .card 를 추가
        // 2. li 요소를 생성
        // 3. 생성된 li 요소에 클래스 card 를 추가
        // 4. 그 외 하위 요소 추가 및 속성 설정.
        // 5. #list 요소에 .card 요소를 추가
        
        const cardList =  document.querySelector("ul#list");

        const li = document.createElement("li");
        li.classList.add("card");
        li.innerText = "새 카드";
        cardList.appendChild(li);

        
        // const section, title = { title: "여야 예산안 놓고 공방", section: "정치", reporter: "조채원", views: 3562 };
        // function makeCard(section, title) { ... }
        // makeCard(rows[0].section, rows[0].title);
        
        // 카드 하나(li)만드는 함수
        //  - 구조 분해(03일차)를 통해 뉴스 정보를 한 번에 전달하고 원하는 것만 받기
        // const {section, title} = { title: "여야 예산안 놓고 공방", section: "정치", reporter: "조채원", views: 3562 };
        function makeCard({section, title}) {
            const li = document.createElement("li");
            li.classList.add("card");
            
            const badge = document.createElement("span");
            badge.classList.add("badge");
            badge.innerText = section;

            const a = document.createElement("a");
            a.innerText = title;

            // li.appendChild(badge);
            // li.appendChild(a);
            li.append(badge, a);

            // card 를 반환
            return li;
        }

        function makeCard2({section, title}) {
            const li = document.createElement("li");
            li.classList.add("card");

            // li 의 내부 문자를 HTML 형식으로 작성
            li.innerHTML = `
                <span class="badge">${section}</span>
                <a href="#">${title}</a>
            `;

            return li;
        }
        
        // cardList.append( makeCard(rows[0]) );

        // 객체 배열 rows 에 있는 모든 기사를 추가
        
        // rows.map(function (r) { return makeCard(r); })
        // rows.map((r) => makeCard(r))
        //  → 화살표 함수가 수행하는 로직이 makeCard 와 동일
        const cards = rows.map(makeCard2);
        cardList.append(...cards);
        
        // rows 는 화면에 표시할 뉴스 전체 기사
        //  - 새로운 기사가 추가되거나 기존 기사가 삭제된 경우
        //    다시 화면에 표시
        //  - 기존 화면에 보여지는 기사들을 지우고 다시 표시
        function displayNewsCard(rows) {
            cardList.innerText = "";
            cardList.append(...rows.map(makeCard2));
        }

        // 전체 기사 표시
        displayNewsCard(rows);  

        // 조회수 5000 이상인 기사만 표시
        displayNewsCard(rows.filter((r) => r.views >= 5000));

        // 정치 섹션
        displayNewsCard(rows.filter((r) => r.section === "정치"));


    </script>
</body>

</html>
