<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File01_Variable</title>
    <script>
        // 변수(Variable)
        //  - 데이터를 저장하기 위한 식별자가 부여된 저장 공간

        // 변수를 다루기 위해서는
        //  1. 변수 선언
        //  2. 데이터 대입
        //  3. 변수 초기화

        // 변수 선언 = "내가 사용할 변수를 만들겠다!"라고 선언
        //  → 어떤 형태의 변수를 만드냐
        //  → 어떤 데이터를 저장하느냐
        var variable1 = 10;     // ES6 이전부터 사용되던 키워드
        let variable2 = 20;     // ES6 이후에 만들어진 키워드
        const VARIABLE3 = 30;  // ES6 이후에 만들어진 키워드

        // let 으로 선언된 변수는
        //  → 동일한 식별자로 재선언이 불가능
        //  → 데이터 수정이 가능하다.
        varibale2 = 30; 
        
        // const 로 선언된 변수는
        //  → 동일한 식별자로 재선언이 불가능
        //  → 데이터 수정도 불가능
        //  → 한 번 데이터가 저장되면 끝까지 유지 = 상수(constant)
        // VARIABLE3 = 40; → 오류 발생
    

    </script>
</head>
<body>
    
</body>
</html>
