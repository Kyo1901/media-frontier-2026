<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File01_Variable</title>
    <script>
        // 변수(Variable)
        //  - 데이터를 저장하기 위한 식별자가 부여된 저장 공간

        // 변수를 다루기 위해서는
        //  1. 변수 선언
        //  2. 데이터 대입
        //  3. 변수 초기화

        // 변수 선언 = "내가 사용할 변수를 만들겠다!"라고 선언
        //  → 어떤 형태의 변수를 만드냐
        //  → 어떤 데이터를 저장하느냐
        var variable1 = 10;     // ES6 이전부터 사용되던 키워드
        let variable2 = 20;     // ES6 이후에 만들어진 키워드
        const VARIABLE3 = 30;  // ES6 이후에 만들어진 키워드

        // let 으로 선언된 변수는
        //  → 동일한 식별자로 재선언이 불가능
        //  → 데이터 수정이 가능하다.
        varibale2 = 30; 

        // const 로 선언된 변수는
        //  → 동일한 식별자로 재선언이 불가능
        //  → 데이터 수정도 불가능
        //  → 한 번 데이터가 저장되면 끝까지 유지 = 상수(constant)
        // VARIABLE3 = 40; → 오류 발생
    </script>

    <script>
        // 데이터를 저장하기 위한 변수 a 를 선언
        let a;

        // 10 을 저장하고 있는 상수 C 를 선언
        const C = 10;

        // 데이터 대입은 다른 프로그래밍 언어와 동일하게
        // 대입 연산자(=)를 사용한다.
        a = 10;

        // a 의 값을 5만큼 증가
        a = a + 5;
        a += 5;
    </script>

    <script>
        // 데이터 타입
        //  - string: 문자열 →  "조채원", "안녕하세요"
        //  - number: 숫자   → 3000, 5.2, NaN (Not a Number)
        //  - boolean: 논리  → true, false
        //  - undefined: 값이 아직 없음 → 변수를 선언만 한 경우
        //  - null: 값이 없음
        //  - function: 함수 → log( ), writeln( ), ..
        //  - object: 객체   → 데이터와 함수를 가진 데이터 집합

        let str = "안녕하세요"; // 문자열
        let num = 4.12;         // 숫자(정수(int), 실수(float))
        // parseInt()   : 정수로 만들어주는 함수
        // parseFloat() : 실수로 만들어주는 함수

        let bool = true;

        // 문자열은 다른 데이터와 연결될 수 있다.
        console.log(str);
        // = "안녕하세요"

        console.log(str + " 반갑습니다.");
        // = "안녕하세요 반갑습니다."

        console.log("30 + 20 = " + 50);
        // = "30 + 20 = 50"
        
        console.log("30 + 20 = " + 30 + 20);
        // = "30 + 20 = 30" + 20
        // = "30 + 20 = 3020"
        // → 연결 연산(+)와 더하기 연산(+)을 작성하면
        //   왼쪽에서부터 연산을 수행한다.
        
        console.log("30 + 20 = " + (30 + 20));
        // → 소괄호를 통해 우선 순위를 명시하는 것이 안전하다.

        // 템플릿 리터럴
        //  - 파이썬의 f-string 과 유사한 기능
        //  - 문자열 리터럴 내에 원하는 값을 삽입하는 기술
        //  - 백틱으로 문자열 리터럴을 작성하고
        //    데이터 삽입할 위치에 ${...} 를 작성
        //  - 여러 줄로 구성된 문자열로 작성도 가능 
        let n1 = 10;
        let n2 = 20;
        console.log(n1 + " + " + n2 + " = " + (n1 + n2));
        // → 연결 연산히 아닌 템플릿 리터럴로 문자열 형식을 바로 알 수 있도록 한다.

        console.log(`${n1} + ${n2} = ${n1+n2}`);

        // 따옴표로 작성된 문자열은 무조건 한 줄로 작성 
        //  → \n 과 같은 문자열로 두 줄로 표현
        str = "안녕하세요.\n반갑습니다."

        // 백틱으로 작성된 문자열은 여러 줄도 작성이 가능
        let temp = `
            안녕하세요.
            반갑습니다.
        `;
        
    </script>
