<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File01_Object.html</title>
    <script>
        function write(innerHTML, tag="div") {
            document.writeln(`<${tag}>${innerHTML}</${tag}>`);
        }
    </script>
</head>
<body>
    <script>
        // 객체
        //  - 다수의 데이터와 함수를 키와 대응되도록 저장하는 자료구조

        // 하나의 기사에 포함된 데이터
        //  - 제목
        //  - 섹션
        //  - 기자
        //  - 조회수
        
        // 기사 객체
        //  → 크롤링에서 읽어온 한 행 데이터
        //  → DB 에서 읽어온 한 행 데이터
        const report = {
            title: "여야 예산안 놓고 공방",
            section: "정치",
            reporter: "조채원",
            views: 3562
        };

        console.log(report.title);      // 속성 접근 연산자 + 식별자 형태의 키
        console.log(report["section"]); // 인덱스 연산자 + 문자열 형태의 키

        // 다수의 기사 데이터를 다루려면
        // 객체 배열 = 다수의 객체를 하나의 묶음으로 묶은 형태

        const rows = [  // 객체들을 저장할 배열
            {   // 첫 번째 기사를 저장할 객체
                title: "여야 예산안 놓고 공방",
                section: "정치",
                reporter: "조채원",
                views: 3562
            },    
            {   // 두 번째 기사를 저장할 객체
                title: "반도체 정책 발표에 업계 촉각",
                section: "경제",
                reporter: "장지민",
                views: 5159
            },    
            {   // 세 번째 기사를 저장할 객체
                title: "미술관 전시 개막",
                section: "문화",
                reporter: "강도현",
                views: 12217
            }
        ];

        // 첫 번째 기사의 제목
        //  - 객체 배열이기 때문에
        //     1. 인덱스를 통해 N 번째 기사에 접근
        //     2. 키를 통해 기사의 제목에 접근
        write("첫 번째 기사 제목: " + rows[0].title);
        
        // 세 번째 기사의 조회수
        write("세 번째 기사 조회수: " + rows[2].views);


        // 세 기사의 조회수 합계
        let viewTotal = 0;

        // 직접 계산 → 비용이 많이 든다.
        viewTotal = rows[0].views + rows[1].views + rows[2].views;

        // for → 인덱스, 범위를 원하는 방식으로 다루기 위한 for 문
        viewTotal = 0;
        for(let i = 0; i < rows.length; i++) {
            viewTotal = rows[i].views;
        }

        // for-of  → 배열 순회하기에 적합 = 배열 또는 객체 내의 값을 하나씩 반환하여 순회
        viewTotal = 0;
        for(let r of rows) {
            // 변수 r 에는 하나의 기사 객체가 저장되어있다.
            viewTotal += r.views;
        }
        write("전체 조회수: " + viewTotal);

        // for-in → 객체 순회하기에 적합 = 배열의 인덱스 또는 객체의 키를 하나씩 반환하여 순회
        
        // 모든 기사의 데이터 출력
        for(let r of rows) {
            // 변수 r = 기사 데이터를 가진 객체
            let str = "";

            for(let k in r) {
                // 변수 k = 기사가 가진 데이터의 키
                str += r[k] + " / ";
            }

            write(str);
        }
    </script>
    <hr>
    <script>
        // 구조 분해 할당

        // 기사의 제목과 조회수
        //  - 기존 방식
        const t = rows[0].title;
        const v = rows[0].views;

        //  - 구조 분해 할당
        const { title, views } = rows[0];
        write("제목: " + title + ", 조회수: "  + views);

        // 키가 없는 경우 undefined 로 반환
        //  = 배열에 인덱스를 잘못 지정한 것처럼 undefined 로 처리
        //  → 변수에 기본 값을 지정할 수 있다.
        const { section, comments = 0 } = rows[0];
        write("섹션: " + section + ", 댓글수: " + comments);

    </script>
</body>
</html>
