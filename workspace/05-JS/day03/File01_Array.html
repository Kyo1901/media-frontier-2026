<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File01_Array.html</title>
</head>
<body>
    <script>
        // 배열(Array)
        //  - 다수의 데이터를 순차적으로 저장하기 위한 자료구조
        //  - 파이썬의 리스트와 유사한 용도와 형태
        //  - 각 원소에 접근하는 방식
        //     - 인덱스 연산자([])와 원소에 대응하는 인덱스
        //     - for-of 문

        // list1 = [1, 2, 3, 4, 5]      // 파이썬의 리스트
        let array = [1, 2, 3, 4, 5];    // JS 의 배열

        // 인덱스는 0부터 1씩 증가
        //  - 음수는 지원하지 않는다.
        document.writeln(`<div>array[0] = ${array[0]}</div>`);
        
        // 배열의 length 속성을 통해 원소의 개수를 알 수 있다.
        document.writeln(`<div>array.length = ${array.length}</div>`);
        
        // 마지막 원소는 (원소의 개수 - 1)로 접근
        document.writeln(`<div>array[array.length - 1] = ${array[array.length - 1]}</div>`);

        array = [15, 37, 28, 12, 89];

        // for 문
        //  - 원소의 개수만큼 반복
        //  - 인덱스 범위만큼 반복
        //      = 인덱스 범위: 0 <= index < length        
        document.writeln("<div>array = ");
        for(let i = 0; i < array.length; i++) {
            document.write(array[i] + " ");
        }
        document.writeln("</div>");

        // for-of 문    
        //  - 배열의 원소를 처음부터 끝까지 순회
        document.writeln("<div>array = ");
        for(let n of array) {
            document.write(n + " ");
        }
        document.writeln("</div>");
    </script>    

    <script>
        // JS 의 배열을 다룰 때 주의할 점

        // 인덱스 범위를 항상 검사하여 다뤄야한다.
        let numbers = [10, 20, 30];

        // 배열의 원소와 개수를 출력
        document.writeln("numbers = " + numbers + "<br>");
        document.writeln("length = " + numbers.length + "<br>");
        
        // 잘못된 인덱스를 지정한 경우
        //  - 오류가 발생하지 않고 정상 처리가 된다.
        //  - 인덱스에 대응하는 값이 없으면 undefined 를 반환
        //    대응하는 값이 없으면 해당 인덱스까지 빈 원소를 추가
        document.writeln("numbers[50] = " + numbers[50] + "<br>");
        numbers[100] = 1000;    // 문법상 문제가 되지 않는다.
        document.writeln("numbers = " + numbers + "<br>");
        document.writeln("length = " + numbers.length + "<br>");
        
        // 안전하게 데이터를 추가하는 방법
        numbers = [10, 20, 30];
        numbers.push(40);   // 마지막 원소로 40 을 추가

        document.writeln("numbers = " + numbers + "<br>");
        document.writeln("length = " + numbers.length + "<br>");

        // const 는 상수로 만들기 위한 키워드
        //  = 저장된 데이터를 바꿀 수 없는 변수

        // const 로 선언된 변수는 저장된 데이터를 고정
        //  - 저장되는 데이터가 배열인 경우 → 배열이 고정
        //  - 단, 배열에 저장된 원소들은 추가, 수정, 삭제가 가능
        const sections = ["정치", "사회", "경제"];
        // 배열 = 집(주소), 원소 = 가구
        // → 집 주소를 바꾸지 못할 뿐 가구는 언제든 넣고 뺄 수 있다.

        sections.push("문화");
        document.writeln("sections = " + sections + "<br>");
        document.writeln("length = " + sections.length + "<br>");
        document.writeln("<hr>");   // 구분선

        // 기존 섹션의 복사본
        //  - 대입 연산자로 대입할 경우 동일한 배열을 참조
        //      = 동일한 집 주소를 가지게 되므로 같은 집에 방문한다.
        // const sectionsCopy = sections;   // 동일한 배열을 사용
        const sectionsCopy = [...sections]; // sections 의 복사본을 생성
        
        // 복사본에 "스포츠" 섹션을 추가
        sectionsCopy.push("스포츠");
        
        // 원본을 출력
        document.writeln("sections = " + sections + "<br>");
        document.writeln("length = " + sections.length + "<br>");
        // 복사본을 출력
        document.writeln("copy = " + sectionsCopy + "<br>");
        document.writeln("length = " + sectionsCopy.length + "<br>");

        

    </script>

</body>
</html>
