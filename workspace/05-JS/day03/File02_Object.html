<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File02_Object.html</title>
</head>
<body>
    <script>
        // 객체(Object)
        //  - 키와 값으로 구성된 자료 구조
        //      = 파이썬의 dict 와 유사한 형태이며 파이썬의 객체와 동일
        //      = 값을 저장할 때 원하는 이름으로 저장이 가능
        //  - 데이터 뿐만 아니라 함수도 저장이 가능
        //  - 용어
        //      속성    : 데이터를 저장하고 있는 키
        //      메서드  : 함수를 저장하고 있는 키

        // 특정 사물 또는 대상을 데이터화하는에 매우 유용하다.
        //  ex) 사용자 정보, 뉴스 데이터, 제품 상세 정보

        // JS 의 객체를 표현할 때는 중괄호({...}) 를 이용
        let user = { 
            // Key: value,
            nickname: "Potter",
            age: 21,

            // Key: function, 
            greet: function() {
                document.writeln(`<div>Welcome Potter!</div>`);
            }
        }

        // 객체 출력하기
        document.writeln(user); // [object Object]로 출력
        console.log(user);
        console.table(user);    // 테이블 형식으로 출력

        // 객체의 속성과 메서드 사용
        //  - 인덱스 연산자([..])와 키를 사용
        //     = 키를 문자열로 작성
        //  - 속성 접근 연산자(.)과 키를 사용
        //     = 키를 식별자 형태로 작성
        document.writeln("닉네임: " + user.nickname + "<br>");
        document.writeln("나이: " + user.age + "<br>");
        user.greet();
        document.writeln("<hr>");

        let key = "nickname";
        document.writeln("닉네임: " + user[key] + "<br>");
        document.writeln("나이: " + user["age"] + "<br>");
        user["greet"]();    // → 메서드는 인덱스 연산자를 권장하지 않음.
        // → Key 를 데이터처럼 다루기 위해 사용

        // for-in 문을 통해 순회
        for(let key in user) {
            // document.writeln(key + " = " + user.key + "<br>"); 
            //  = key 라는 속성이 없기 때문에 undefined 가 반환

            // 객체의 키가 문자열로 전달되기 때문에
            // 인덱스 연산자로 접근
            
            // 함수는 출력 제외
            //  = 타입이 함수인 경우 반복을 넘긴다.
            if(typeof user[key] == "function") {
                continue;
            }
            
            document.writeln(key + " = " + user[key] + "<br>"); 
        }




    </script>
</body>
</html>
