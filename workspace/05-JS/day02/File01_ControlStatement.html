<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File01_ControlStatement.html</title>
</head>
<body>
    <script>
        // 제어문
        //  - 조건문 : 조건에 따라 분기를 나눈다.
        //  - 반복문 : 조건 또는 상황에 맞게 반복 수행한다.
        //  - 함수   : 분기를 원할 때 사용한다.

        // 조건문
        //  - 파이썬과 유사하다.
        //  - 파이썬은 코드 블록을 들여쓰기를 통해 구분
        //  - JS 는 코드 블록을 중괄호({...})를 통해 만든다.
        //  - 추가로 swicth 문이 있다.

        let views = 2300;
        let grade;

        // 만약 조회수(views)가 10000 이상이면 "인기" 등급 출력
        // 그렇지 않고 조회수가 1000 이상이면 "보통" 등급을 출력
        // 1000 미만이면 "적음" 등급을 출력
        /*
            파이썬에서의 조건문
            if views >= 10000:
                grade = '인기'
            elif views >= 1000 :  # → else + if 의 합성어
                grade = '보통'
            else:
                grade = '적음'
        */

        if(views >= 10000) {
            // if 의 조건을 만족할 때 수행되는 영역
            grade = "인기";
        } 
        else if(views >= 1000) {   // → else + if 을 이어서 작성
            grade = "보통";
        }
        else {
            grade = "적음";
        }
        

        document.writeln(`<h3>조회수:${views}, 등급:${grade}</h3>`);
    </script>
</body>
</html>
