<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File01_ControlStatement.html</title>
</head>
<body>
    <script>
        // 제어문
        //  - 조건문 : 조건에 따라 분기를 나눈다.
        //  - 반복문 : 조건 또는 상황에 맞게 반복 수행한다.
        //  - 함수   : 분기를 원할 때 사용한다.

        // 조건문
        //  - 파이썬과 유사하다.
        //  - 파이썬은 코드 블록을 들여쓰기를 통해 구분
        //  - JS 는 코드 블록을 중괄호({...})를 통해 만든다.
        //  - 추가로 swicth 문이 있다.

        let views = 2300;
        let grade;

        // 만약 조회수(views)가 10000 이상이면 "인기" 등급 출력
        // 그렇지 않고 조회수가 1000 이상이면 "보통" 등급을 출력
        // 1000 미만이면 "적음" 등급을 출력
        /*
            파이썬에서의 조건문
            if views >= 10000:
                grade = '인기'
            elif views >= 1000 :  # → else + if 의 합성어
                grade = '보통'
            else:
                grade = '적음'
        */

        if(views >= 10000) {
            // if 의 조건을 만족할 때 수행되는 영역
            grade = "인기";
        } 
        else if(views >= 1000) {   // → else + if 을 이어서 작성
            grade = "보통";
        }
        else {
            grade = "적음";
        }
        document.writeln(`<h3>조회수:${views}, 등급:${grade}</h3>`);
    </script>
    <script>
        // switch 문
        //  - 값을 통해 분기를 나누는 구문

        let choice = 2;

        // 값을 통해 분기를 나누는 경우
        //  - 메뉴 선택
        //  - 이벤트 처리
        if(choice == 1) {  }
        else if(choice == 2) { }
        else if(choice == 3) { }
        else if(choice == 4 || choice == 5 || choice == 6) { }
        else { }

        // 위처럼 변수 choice 에 따라 수행할 분기가 달라진다.
        //  → 위와 같은 경우 switch 문으로 대체가 가능

        // switch 문의 작성법
        //  - switch 구문에는 분기를 나눌 표현식 또는 변수(단, 실수는 안됨)
        //  - 모든 분기를 하나의 블록 내에 작성
        //      → 하나의 분기 내에서 시작 위치와 끝나는 지점을 지정하는 방식
        //      → 시작 위치는 case 문과 값을 작성
        //      → 끝나는 지점은 break 문을 작성 = switch 문 종료

        switch(choice) {
            case 1:     // choice 가 1 일 때 시작 위치
                document.writeln("<div>첫 번째 메뉴를 선택하셨습니다.</div>");
                break;
                
            case 2:     // choice 가 2 일 때 시작 위치
                document.writeln("<div>두 번째 메뉴를 선택하셨습니다.</div>");
                break;

            case 3:     // choice 가 3 일 때 시작 위치
                document.writeln("<div>세 번째 메뉴를 선택하셨습니다.</div>");
                break;

            case 4:     // choice 가 4 일 때 시작 위치
            case 5:     // choice 가 5 일 때 시작 위치
            case 6:     // choice 가 6 일 때 시작 위치
                document.writeln("<div>세트 메뉴를 선택하셨습니다.</div>");
                break
        }

        // 이벤트 예시
        //  - 각 방향키 누르면 body 의 배경색을 설정
        document.body.onkeydown = function(event) { 
            console.log(event.code); // 키보드의 물리적인 키
            console.log(event.key); // 눌려진 문자
            switch(event.code) {
                case "ArrowDown":
                case "PageDown":
                case "Space":
                    this.style.backgroundColor = "white";
                    break;
                case "ArrowUp":
                case "PageUp":
                    this.style.backgroundColor = "yellowgreen";
                    break;
                case "ArrowLeft":
                    this.style.backgroundColor = "paleturquoise";
                    break;
                case "ArrowRight":
                    this.style.backgroundColor = "palegreen";
                    break;
            }
        };
    </script>

    <script>
        // 반복문
        //  - 코드를 반복 수행하기 위한 구문
        //  - 종류
        //      while 문        : 조건을 만족하는 동안 반복 수행
        //      do-while 문     : 조건을 만족하는 동안 반복 수행(최소 1번)
        //      for 문          : 범위 또는 횟수만큼 반복 수행
        //      for-each 문     : 배열 또는 객체를 순회하며 반복 수행

        // while 문
        //  - "조건"을 만족하는 동안 반복 수행

        // 항목을 5개 작성
        document.writeln("<ol>");
        let i = 0;
        while(i < 8) {
            document.writeln("<li>새로운 항목</li>");

            // i+=1;    // i 의 값을 1 증가
            i++;    // i 의 값을 1 증가
        }
        document.writeln("</ol>");

        // do-while 문
        //  - while 과 동일하게 조건을 통해 반복 수행
        //  - 단, 먼저 코드를 수행한 결과를 가지고 반복 수행 여부를 결정
        document.writeln("<ol>");
        i = 0;
        do {
            document.writeln("<li>새로운 항목</li>");

            // i+=1;    // i 의 값을 1 증가
            i++;    // i 의 값을 1 증가
        } while(i < 5);  // 세미콜론(;)을 작성해야한다.
        document.writeln("</ol>");
        document.writeln("<hr>");

        // for 문
        //  - 횟수 또는 범위를 다루기 위한 구문
        //  - 횟수를 다루기 위해서는
        //      1. 횟수를 저장할 변수 선언
        //      2. 횟수를 검사할 조건식
        //      3. 횟수를 증가할 증감식 = 카운팅 연산
        //  - 위 3가지를 한 구문에 모두 작성한다.
        //      → 구조는 제일 복잡할 순 있지만
        //        직관적이기 때문에 어느정도 익히면 많이 어렵지는 않다.
        //  - for 문의 흐름
        //      1. 변수 선언 및 초기화
        //      2. 반복 수행 여부 검사
        //      3. 조건을 만족하면 본문을 수행
        //      4. 본문 수행 후 증감식을 수행
        //      5. 반복 수행 여부 검사
        //      6. 조건을 만족하면 본문을 수행
        //         조건을 만족하지 않으면 for 문 종료

        // 5개 항목을 작성

        // count 변수가 0 부터 5가 될 때까지 1씩 증가하는 반복문
        document.writeln("<ol>");
        // let count;
        // for(count = 0; count < 5; count++)  { ... }
        // document.writeln("count: " + count); → count 가 출력됨

        for(let count = 0; count < 5; count++)  {
            document.writeln("<li>for 문으로 추가된 항목 - " + count + "</li>");
        }
        document.writeln("</ol>");

        //document.writeln("count: " + count);
        // → for 문 또는 코드 블록 내에서 선언된 변수는
        //   외부에서 사용할 수 없다.
        //    = 해당 영역이 끝나면 바로 사라진다.
        // → 영역이 끝난 이후에서 사용하려면 구문 외부에서 선언

    </script>
</body>
</html>
