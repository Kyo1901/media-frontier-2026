<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File01_ControlStatement.html</title>
</head>
<body>
    <script>
        // 제어문
        //  - 조건문 : 조건에 따라 분기를 나눈다.
        //  - 반복문 : 조건 또는 상황에 맞게 반복 수행한다.
        //  - 함수   : 분기를 원할 때 사용한다.

        // 조건문
        //  - 파이썬과 유사하다.
        //  - 파이썬은 코드 블록을 들여쓰기를 통해 구분
        //  - JS 는 코드 블록을 중괄호({...})를 통해 만든다.
        //  - 추가로 swicth 문이 있다.

        let views = 2300;
        let grade;

        // 만약 조회수(views)가 10000 이상이면 "인기" 등급 출력
        // 그렇지 않고 조회수가 1000 이상이면 "보통" 등급을 출력
        // 1000 미만이면 "적음" 등급을 출력
        /*
            파이썬에서의 조건문
            if views >= 10000:
                grade = '인기'
            elif views >= 1000 :  # → else + if 의 합성어
                grade = '보통'
            else:
                grade = '적음'
        */

        if(views >= 10000) {
            // if 의 조건을 만족할 때 수행되는 영역
            grade = "인기";
        } 
        else if(views >= 1000) {   // → else + if 을 이어서 작성
            grade = "보통";
        }
        else {
            grade = "적음";
        }
        document.writeln(`<h3>조회수:${views}, 등급:${grade}</h3>`);
    </script>
    <script>
        // switch 문
        //  - 값을 통해 분기를 나누는 구문

        let choice = 2;

        // 값을 통해 분기를 나누는 경우
        //  - 메뉴 선택
        //  - 이벤트 처리
        if(choice == 1) {  }
        else if(choice == 2) { }
        else if(choice == 3) { }
        else if(choice == 4 || choice == 5 || choice == 6) { }
        else { }

        // 위처럼 변수 choice 에 따라 수행할 분기가 달라진다.
        //  → 위와 같은 경우 switch 문으로 대체가 가능

        // switch 문의 작성법
        //  - switch 구문에는 분기를 나눌 표현식 또는 변수(단, 실수는 안됨)
        //  - 모든 분기를 하나의 블록 내에 작성
        //      → 하나의 분기 내에서 시작 위치와 끝나는 지점을 지정하는 방식
        //      → 시작 위치는 case 문과 값을 작성
        //      → 끝나는 지점은 break 문을 작성 = switch 문 종료

        switch(choice) {
            case 1:     // choice 가 1 일 때 시작 위치
                document.writeln("<div>첫 번째 메뉴를 선택하셨습니다.</div>");
                break;
                
            case 2:     // choice 가 2 일 때 시작 위치
                document.writeln("<div>두 번째 메뉴를 선택하셨습니다.</div>");
                break;

            case 3:     // choice 가 3 일 때 시작 위치
                document.writeln("<div>세 번째 메뉴를 선택하셨습니다.</div>");
                break;

            case 4:     // choice 가 4 일 때 시작 위치
            case 5:     // choice 가 5 일 때 시작 위치
            case 6:     // choice 가 6 일 때 시작 위치
                document.writeln("<div>세트 메뉴를 선택하셨습니다.</div>");
                break
        }

    </script>    
</body>
</html>
